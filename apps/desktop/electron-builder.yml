appId: com.yuanpu.agent
productName: MindLink
asar: true
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../app/dist
    to: app
    filter:
      - '**/*'
  - from: ../app/agents
    to: app/agents
    filter:
      - '**/*'
  - from: ../app/emo.json
    to: app/emo.json
  - from: ../app/src/assets/brand
    to: app/brand
    filter:
      - '*.png'
  - from: ../runtime/dist-native/bin
    to: runtime
    filter:
      - 'YuanpuAgentRuntime-*'
  - from: ../python-capabilities/dist-artifact/bundle
    to: capabilities/builtin.python.echo
    filter:
      - '**/*'
artifactName: 'MindLink-${version}-${os}-${arch}.${ext}'
executableName: MindLink
mac:
  icon: dist/emo-icon.png
  # WordBridge (Word revision bridge) ships only in the macOS bundle; see apps/wordbridge.
  extraResources:
    - from: ../wordbridge/dist
      to: wordbridge
      filter:
        - '**/*'
    # Userspace tailscaled + CLI for joining a tailnet without installing Tailscale.
    - from: dist-tailscale
      to: tailscale
      filter:
        - tailscaled
        - tailscale
  target:
    - dmg
    - zip
win:
  icon: dist/emo-icon.png
  target:
    - nsis
    - zip
linux:
  icon: dist/emo-icon.png
  target:
    - AppImage
    - tar.gz
publish:
  provider: github
  owner: linxinhong
  repo: yuanpu-agent
