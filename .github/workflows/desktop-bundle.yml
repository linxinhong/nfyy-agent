name: Desktop Bundle

on:
  workflow_dispatch:
    inputs:
      artifact-mode:
        description: Upload installers directly or as a grouped release artifact
        required: false
        type: choice
        options:
          - direct
          - grouped
        default: direct
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-desktop
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 1
      platforms:
        description: Platforms to build
        required: false
        type: choice
        options:
          - all
          - darwin-arm64
          - linux-x64
          - win32-x64
        default: all
  workflow_call:
    inputs:
      artifact-mode:
        description: Upload installers directly or as a grouped release artifact
        required: false
        type: string
        default: grouped
      artifact-prefix:
        description: Prefix for uploaded artifact names
        required: false
        type: string
        default: yuanpu-agent-desktop
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 1
      platforms:
        description: "all, or one of darwin-arm64, linux-x64, win32-x64"
        required: false
        type: string
        default: all
    secrets:
      YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64:
        required: false
      YUANPU_ARTIFACT_SIGNING_KEY_ID:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Select platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[{"os":"ubuntu-24.04","target":"linux-x64"},{"os":"macos-14","target":"darwin-arm64"},{"os":"windows-2022","target":"win32-x64"}]'
          matrix=$(jq -c --arg p "$PLATFORMS" '[.[] | select($p == "all" or .target == $p)]' <<<"$all")
          if [ "$matrix" = "[]" ]; then echo "::error::Unknown platform: $PLATFORMS"; exit 1; fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  desktop-bundle:
    name: Desktop bundle (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4.25'

      # Builds the bundled userspace tailscaled; GOTOOLCHAIN=auto fetches the exact
      # Go release Tailscale pins, verified through the Go checksum database.
      - name: Setup Go
        if: matrix.target == 'darwin-arm64'
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      # Developer ID signing and notarization are optional: without CSC_LINK the
      # macOS build stays ad-hoc signed. The .p8 key only ever lives in RUNNER_TEMP.
      # Notarization prefers an App Store Connect API key (.p8) and falls back to
      # an Apple ID with an app-specific password. NOTARIZE_METHOD tells later
      # steps which credentials, if any, electron-builder should receive.
      - name: Prepare macOS notarization credentials
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK is not configured; building an ad-hoc signed macOS app."
            echo "NOTARIZE_METHOD=none" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            key="$RUNNER_TEMP/apple-notary/AuthKey.p8"
            mkdir -p "$(dirname "$key")"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
            echo "NOTARIZE_METHOD=api-key" >> "$GITHUB_ENV"
            echo "Notarizing with App Store Connect API key."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "NOTARIZE_METHOD=apple-id" >> "$GITHUB_ENV"
            echo "Notarizing with Apple ID and app-specific password."
          else
            echo "::warning::No notarization credentials configured; the app will be signed but not notarized."
            echo "NOTARIZE_METHOD=none" >> "$GITHUB_ENV"
          fi

      - name: Build desktop package
        env:
          # Only macOS consumes the Apple certificate; Windows must never pick up CSC_LINK.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.target == 'darwin-arm64' && secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.target == 'darwin-arm64' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'darwin-arm64' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ env.NOTARIZE_METHOD == 'api-key' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.NOTARIZE_METHOD == 'api-key' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ env.NOTARIZE_METHOD == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.NOTARIZE_METHOD == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.NOTARIZE_METHOD == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}
          YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64 }}
          YUANPU_ARTIFACT_SIGNING_KEY_ID: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_ID }}
        run: pnpm package:desktop

      - name: Verify macOS signature and notarization
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "Ad-hoc build; skipping Developer ID verification."
            exit 0
          fi
          app=$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
          if [ "${NOTARIZE_METHOD:-none}" != "none" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi

      - name: Verify bundled WordBridge
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          app=$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)
          node apps/wordbridge/scripts/smoke-bundle.mjs "$app/Contents/Resources/wordbridge"
          # Running the bridge must leave the signed bundle untouched.
          if [ -n "$CSC_LINK" ]; then codesign --verify --deep --strict "$app"; fi

      - name: Verify bundled Tailscale
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          app=$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)
          node apps/desktop/scripts/smoke-tailscale.mjs "$app/Contents/Resources/tailscale"
          if [ -n "$CSC_LINK" ]; then
            codesign --verify --strict "$app/Contents/Resources/tailscale/tailscaled"
            codesign --verify --deep --strict "$app"
          fi

      - name: Verify packaged capability without system Python
        run: node apps/desktop/test/task-008-packaged-capability-probe.mjs

      - name: Upload grouped desktop artifact for release
        if: inputs.artifact-mode == 'grouped'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.tar.gz
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.zip

      - name: Upload macOS DMG directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-mac-arm64.dmg
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload macOS ZIP directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-mac-arm64.zip
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Windows installer directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-win-x64.exe
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Windows ZIP directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-win-x64.zip
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Linux AppImage directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-linux-x86_64.AppImage
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Upload Linux tarball directly
        if: inputs.artifact-mode == 'direct' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: apps/desktop/release/*-linux-x64.tar.gz
          archive: false
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
