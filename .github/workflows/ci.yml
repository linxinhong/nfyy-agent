name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Agent typecheck, build, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Go
        # Desktop tests start server/backend as a loopback catalog fixture.
        # server/ itself is not checked or built here.
        uses: actions/setup-go@v6
        with:
          go-version-file: server/backend/go.mod
          cache-dependency-path: server/backend/go.sum

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4.25'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Prepare Python capability environment
        # Runtime tests start the real Python MCP from apps/python-capabilities/.venv.
        run: pnpm prepare:python-capabilities

      - name: Check agent
        run: pnpm check:agent
