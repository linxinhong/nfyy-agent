name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capability-signing-gate:
    name: Require production capability signing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse ephemeral release signing
        env:
          YUANPU_ARTIFACT_SIGNING_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_BASE64 }}
          YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_TRUST_ROOT_PUBLIC_KEY_BASE64 }}
          YUANPU_ARTIFACT_SIGNING_KEY_ID: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_ID }}
          YUANPU_ARTIFACT_BASE_URL: ${{ secrets.YUANPU_ARTIFACT_BASE_URL }}
        run: node apps/python-capabilities/scripts/verify-release-signing-env.mjs

  native-artifacts:
    needs: capability-signing-gate
    uses: ./.github/workflows/runtime-bundle.yml
    secrets: inherit
    with:
      artifact-prefix: yuanpu-agent-native
      retention-days: 1

  desktop-artifacts:
    needs: capability-signing-gate
    # Upper bound for the reusable workflow: its build jobs stay contents: read and
    # only the draft-release job (unused here) asks for write.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/desktop-bundle.yml
    secrets: inherit
    with:
      artifact-mode: grouped
      artifact-prefix: yuanpu-agent-desktop
      retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - native-artifacts
      - desktop-artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # produce-manifest.mjs imports the built @yuanpu-agent/protocol package.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Build protocol package
        run: pnpm --filter @yuanpu-agent/protocol run build

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yuanpu-agent-native-*
          path: dist-release
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: yuanpu-agent-desktop-*
          path: dist-release
          merge-multiple: true

      # Native artifacts upload from apps/runtime and apps/python-capabilities, so
      # they download nested under their common ancestor. Manifests and the
      # release upload expect every asset at the top of dist-release.
      - name: Flatten release assets
        run: |
          find dist-release -mindepth 2 -type f -exec mv -n -t dist-release {} +
          find dist-release -mindepth 1 -type d -empty -delete
          if find dist-release -mindepth 1 -type d | grep -q .; then
            echo "::error::Unexpected nested files remain in dist-release"; find dist-release; exit 1
          fi
          ls -la dist-release

      - name: Produce update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/runtime/scripts/native/produce-manifest.mjs dist-release "$RELEASE_TAG"

      - name: Produce signed Python capability manifest
        env:
          YUANPU_ARTIFACT_SIGNING_KEY_BASE64: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_BASE64 }}
          YUANPU_ARTIFACT_SIGNING_KEY_ID: ${{ secrets.YUANPU_ARTIFACT_SIGNING_KEY_ID }}
          YUANPU_ARTIFACT_BASE_URL: ${{ secrets.YUANPU_ARTIFACT_BASE_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node apps/python-capabilities/scripts/produce-release-manifest.mjs dist-release "$RELEASE_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-release/* --generate-notes --verify-tag
