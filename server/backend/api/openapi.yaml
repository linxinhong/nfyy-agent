openapi: 3.0.3
info:
  title: Yuanpu Server API
  version: 0.1.0
  description: >-
    Knowledge center API. /v1 is the compatibility boundary. The wiki preview
    contains public sample data only. Authenticated resource APIs manage the
    first news, wiki, and AI capability publishing workflow.
servers:
  - url: http://127.0.0.1:8788
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Process liveness; does not imply database readiness
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/ready:
    get:
      operationId: getReady
      summary: Database connectivity and migration readiness
      responses:
        '200':
          description: Database is reachable and migrations are current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database is unconfigured, unavailable, or needs migrations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/preview/wiki:
    get:
      operationId: getWikiPreview
      summary: Public sample wiki entries for the desktop center preview
      responses:
        '200':
          description: Sample entries; never contains organization or personal data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiPreviewResponse'
  /v1/industry:
    get:
      operationId: getIndustry
      summary: Read the configured industry knowledge types and validation fields
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Active industry pack
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryPack'}
  /v1/industry/templates/{type}:
    get:
      operationId: getIndustryTemplate
      summary: Read a submission template from the configured industry pack
      security: [{bearerAuth: []}]
      parameters:
        - name: type
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Markdown template
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryTemplate'}
        '404':
          description: Unknown knowledge type
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/industry/validate:
    post:
      operationId: validateIndustrySubmission
      summary: Validate a structured submission using the configured industry pack
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndustrySubmission'}
      responses:
        '200':
          description: Validation result; no knowledge is published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndustryValidation'}
  /v1/integrations/bookstack/status:
    get:
      operationId: getBookStackStatus
      summary: Check the configured private BookStack API connection
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: BookStack API is reachable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationStatus'}
        '503':
          description: BookStack API is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/catalog/search:
    get:
      operationId: searchCatalog
      summary: Search the public skill and capability directory
      parameters:
        - name: q
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Matching catalog entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogSearchResponse'}
  /v1/catalog/items/{id}:
    get:
      operationId: getCatalogItem
      summary: Read one public catalog entry
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Catalog entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogItem'}
        '404':
          description: Entry not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/capability-packages/{id}/manifest:
    get:
      operationId: getCapabilityManifest
      summary: Read an already signed capability manifest; clients verify its signature
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Published manifest JSON
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404':
          description: Package not published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/capability-packages/{id}/artifacts/{filename}:
    get:
      operationId: getCapabilityArtifact
      summary: Download a manifest-referenced immutable capability archive
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: filename
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Immutable archive
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '404':
          description: Archive not published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/api-key:
    post:
      operationId: loginWithApiKey
      summary: Exchange a valid member API key for a twelve-hour bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyLoginRequest'}
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Invalid, expired, revoked, or deactivated API key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/portal/context:
    get:
      operationId: getPortalContext
      summary: Presentation context derived from the HTTP User-Agent; never authorizes access
      responses:
        '200':
          description: Browser presentation context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalContext'}
  /v1/auth/password:
    post:
      operationId: loginWithPassword
      summary: Sign in to the browser or desktop enrollment flow with account credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordLoginRequest'}
      responses:
        '200':
          description: Password-authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/device-key:
    post:
      operationId: issueOwnDeviceKey
      summary: Issue a desktop API key from a password-authenticated session
      security: [{bearerAuth: []}]
      responses:
        '201':
          description: Newly issued key; secret shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedApiKey'}
        '401':
          description: Password session required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Current active member
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, expired, or revoked session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current bearer session
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Session revoked
  /v1/admin/teams:
    get:
      operationId: listTeams
      summary: List organization teams; administrator only
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Team'}
    post:
      operationId: createTeam
      summary: Create a team; administrator only
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          description: Administrator required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/users:
    get:
      operationId: listUsers
      summary: List organization members; administrator only
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Members without credentials
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/User'}
    post:
      operationId: createUser
      summary: Create a member; administrator can set a password separately
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '403':
          description: Administrator required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: updateUser
      summary: Replace member role, team, and active state; administrator only
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Administrator required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/users/{id}/password:
    put:
      operationId: setUserPassword
      summary: Set a member password and revoke existing password sessions; administrator only
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetPasswordRequest'}
      responses:
        '204': {description: Password set}
        '403':
          description: Administrator required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/admin/roles:
    get:
      operationId: listRolePermissions
      summary: List role permissions; administrator only
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Role permission matrix
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RolePermission'}
  /v1/admin/roles/{role}/{action}:
    put:
      operationId: updateRolePermission
      summary: Set the scope granted to a role for one action
      security: [{bearerAuth: []}]
      parameters:
        - name: role
          in: path
          required: true
          schema: {type: string, enum: [admin, reviewer, team_lead, member]}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [create, read, edit, submit, review, withdraw]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRolePermissionRequest'}
      responses:
        '200':
          description: Updated permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePermission'}
  /v1/admin/api-keys:
    get:
      operationId: listApiKeys
      summary: List API key metadata without secrets; administrator only
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApiKey'}
    post:
      operationId: issueApiKey
      summary: Issue a member API key; secret is returned only once
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueApiKeyRequest'}
      responses:
        '201':
          description: Newly issued key and one-time secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedApiKey'}
  /v1/admin/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key and every session issued through it; administrator only
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Key and derived sessions revoked
        '404':
          description: Key not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/resources:
    get:
      operationId: listResources
      summary: List published resources visible to the current member
      security: [{bearerAuth: []}]
      parameters:
        - name: kind
          in: query
          schema: {type: string, enum: [news, wiki, capability]}
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
      responses:
        '200':
          description: Visible published resources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Resource'}
    post:
      operationId: createResource
      summary: Create a private draft; submission is a separate action
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceInput'}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/resources/mine:
    get:
      operationId: listMyResources
      summary: List the current author's resources, including drafts and submissions
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own resources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Resource'}
  /v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getResource
      summary: Read an authorized resource or its currently published revision
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '404':
          description: Resource does not exist or is not visible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      operationId: editResource
      summary: Add a new draft revision as the resource owner
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceInput'}
      responses:
        '200':
          description: New draft revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/resources/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: submitResource
      summary: Author confirms the latest draft and submits it for independent review
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Submitted revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/resources/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: approveResource
      summary: Publish a submitted revision as an authorized reviewer
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Published revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/resources/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: rejectResource
      summary: Return a submitted revision to its owner
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Rejected revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/resources/{id}/withdraw:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: withdrawResource
      summary: Withdraw the currently published revision
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Withdrawal recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
  /v1/review/queue:
    get:
      operationId: getReviewQueue
      summary: Submitted revisions available to the current reviewer
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Resource'}
  /v1/logs:
    post:
      operationId: postOperationLog
      summary: Upload a bounded structured operation log without conversation content
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationLogInput'}
      responses:
        '201':
          description: Stored log receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogReceipt'}
  /v1/data-uploads:
    post:
      operationId: uploadData
      summary: Upload a bounded data file, optionally attached to an authored resource
      security: [{bearerAuth: []}]
      parameters:
        - name: resourceId
          in: query
          schema: {type: string}
        - name: X-File-Name
          in: header
          required: true
          schema: {type: string, maxLength: 180}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Stored file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataUpload'}
  /v1/data-uploads/{id}:
    get:
      operationId: downloadData
      summary: Download a stored file as its uploader
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    IndustryPack:
      type: object
      additionalProperties: false
      required: [id, name, knowledgeTypes, areas, requiredSections, confidences]
      properties:
        id: {type: string}
        name: {type: string}
        knowledgeTypes:
          type: array
          items: {$ref: '#/components/schemas/IndustryKnowledgeType'}
        areas:
          type: array
          items: {$ref: '#/components/schemas/IndustryArea'}
        requiredSections:
          type: array
          items: {type: string}
        confidences:
          type: array
          items: {type: string}
    IndustryKnowledgeType:
      type: object
      additionalProperties: false
      required: [id, name, requiredFields]
      properties:
        id: {type: string}
        name: {type: string}
        requiredFields:
          type: array
          items: {type: string}
    IndustryArea:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    IndustryTemplate:
      type: object
      additionalProperties: false
      required: [markdown]
      properties:
        markdown: {type: string}
    IndustrySubmission:
      type: object
      additionalProperties: false
      required: [title, type, author, submittedAt, area, source, confidence, redacted, fields, sections]
      properties:
        title: {type: string}
        type: {type: string}
        author: {type: string}
        submittedAt: {type: string}
        area: {type: string}
        source: {type: string}
        confidence: {type: string}
        redacted: {type: boolean}
        matterId: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        sections: {type: object, additionalProperties: {type: string}}
    IndustryValidation:
      type: object
      additionalProperties: false
      required: [valid, violations]
      properties:
        valid: {type: boolean}
        violations:
          type: array
          items: {$ref: '#/components/schemas/IndustryViolation'}
    IndustryViolation:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    IntegrationStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ready]}
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, role, teamId, active]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        name: {type: string}
        role: {type: string, enum: [admin, reviewer, team_lead, member]}
        teamId: {type: string, nullable: true}
        active: {type: boolean}
        permissions:
          type: object
          additionalProperties: {type: string, enum: [none, own, team, all]}
    RolePermission:
      type: object
      additionalProperties: false
      required: [role, action, scope]
      properties:
        role: {type: string, enum: [admin, reviewer, team_lead, member]}
        action: {type: string, enum: [create, read, edit, submit, review, withdraw]}
        scope: {type: string, enum: [none, own, team, all]}
    UpdateRolePermissionRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: {type: string, enum: [none, own, team, all]}
    OperationLogInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, kind, outcome, durationMs, occurredAt]
      properties:
        idempotencyKey: {type: string, minLength: 8, maxLength: 128}
        resourceId: {type: string}
        runId: {type: string, maxLength: 128}
        kind: {type: string, enum: [agent_run, tool_step, resource_use]}
        outcome: {type: string, enum: [succeeded, failed, cancelled]}
        durationMs: {type: integer, minimum: 0, maximum: 86400000}
        occurredAt: {type: string, format: date-time}
    LogReceipt:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
    DataUpload:
      type: object
      additionalProperties: false
      required: [id, filename, contentType, byteSize, sha256, createdAt]
      properties:
        id: {type: string}
        resourceId: {type: string, nullable: true}
        filename: {type: string}
        contentType: {type: string}
        byteSize: {type: integer, minimum: 1, maximum: 2097152}
        sha256: {type: string}
        createdAt: {type: string, format: date-time}
    Team:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    ResourceInput:
      type: object
      additionalProperties: false
      required: [kind, visibility, title, summary, body]
      properties:
        kind: {type: string, enum: [news, wiki, capability]}
        visibility: {type: string, enum: [team, organization]}
        teamId: {type: string, nullable: true}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, maxLength: 300}
        body: {type: string}
        details: {type: object, additionalProperties: true}
    Resource:
      type: object
      additionalProperties: false
      required: [id, kind, ownerId, visibility, teamId, revision, status, title, summary, body, details]
      properties:
        id: {type: string}
        kind: {type: string, enum: [news, wiki, capability]}
        ownerId: {type: string}
        visibility: {type: string, enum: [team, organization]}
        teamId: {type: string, nullable: true}
        revision: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        title: {type: string}
        summary: {type: string}
        body: {type: string}
        details: {type: object, additionalProperties: true}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        token: {type: string}
    PortalContext:
      type: object
      additionalProperties: false
      required: [agentBrowser]
      properties:
        agentBrowser: {type: boolean}
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 1024}
    SetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
