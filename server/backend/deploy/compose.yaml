name: yuanpu-server
services:
  db:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: yuanpu
      POSTGRES_USER: yuanpu
      POSTGRES_PASSWORD: ${YUANPU_DB_PASSWORD:?Set YUANPU_DB_PASSWORD in the environment or .env}
    ports:
      - "127.0.0.1:${YUANPU_DB_PORT:-54328}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuanpu -d yuanpu"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    command: ["migrate"]
    environment:
      YUANPU_DATABASE_URL: postgres://yuanpu:${YUANPU_DB_PASSWORD}@db:5432/yuanpu?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      YUANPU_DATABASE_URL: postgres://yuanpu:${YUANPU_DB_PASSWORD}@db:5432/yuanpu?sslmode=disable
      YUANPU_BOOKSTACK_URL: ${YUANPU_BOOKSTACK_URL:-}
      YUANPU_BOOKSTACK_TOKEN_ID: ${YUANPU_BOOKSTACK_TOKEN_ID:-}
      YUANPU_BOOKSTACK_TOKEN_SECRET: ${YUANPU_BOOKSTACK_TOKEN_SECRET:-}
      YUANPU_BOOKSTACK_ALLOW_HTTP: ${YUANPU_BOOKSTACK_ALLOW_HTTP:-false}
    ports:
      - "127.0.0.1:${YUANPU_SERVER_PORT:-8788}:8788"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/yuanpu-server", "probe"]
      interval: 5s
      timeout: 4s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  postgres-data:
