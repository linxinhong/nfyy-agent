  - id: TASK-034
    title: "Capability Registry and /mcp/agent meta-tool surface"
    status: done
    goal: >
      One governed discovery+execution surface over every enterprise
      capability: search_capabilities returns only what the caller's
      workspace, policy and risk posture actually allow (permission-aware
      discovery), and execute_capability runs the full governance chain
      (identity, workspace, policy, risk, approval, DLP egress, audit).
    scope:
      in:
        - "packages/capability: composite Source registry (Search/Parse/Execute) with token-scored search"
        - "mcp source adapter over mcpgateway.Registry (risk level + credential refs preserved); skill source adapter over released skill_packages"
        - "GET/POST /mcp/agent: search_capabilities + execute_capability meta-tools, colon names mcp:<server>:<tool> / skill:<name>[@version]"
        - "permission-aware search: workspace membership + policy decision + risk gating shape the status field (available | needs_approval | denied_by_policy | disabled)"
        - "execute revalidates everything; MCP tool results pass the subject-aware DLP egress scan; every call audited on the reliable path"
        - "structured error taxonomy with retry guidance (unknown_capability / forbidden / needs_approval / policy_blocked)"
        - "dual-surface coexistence: /mcp/{server} unchanged, both surfaces share the same governance"
      out:
        - "HTTP/OpenAPI/model-alias capability sources (next card)"
        - "OAuth for the MCP surface (enterprise agk_* credentials stay the frozen contract)"
        - "schemaDigest drift detection (follow-up)"
    constraints:
      - "Discovery is UX, never authorization: execute revalidates identity, workspace, policy, risk and approval regardless of what search returned."
      - "Skill execution returns governed install/sync guidance — skill bodies still run only via eap sync locally (ADR-0017)."
      - "The meta-tool list stays constant at two tools regardless of how many capabilities exist."
    forbidden:
      - "Returning capabilities outside the caller's workspace authority."
      - "Skipping the DLP egress scan or audit on execute_capability."
      - "Growing the tool list per capability (that is the direct-mount surface's job)."
