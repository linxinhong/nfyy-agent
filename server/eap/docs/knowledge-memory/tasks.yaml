      一致地存入 PostgreSQL；模型或重建失败不暴露半成品，也不破坏现有可检索版本。
    scope:
      in:
        - "按接受的契约适配 Knowledge Embedder 和既有 Provider 执行，补齐本链 Policy/DLP/可靠审计/Usage 与超时取消"
        - "应用已评审的 pgvector、generation 和必要来源字段迁移，更新开发镜像钉版与数据库升级说明"
        - "原有 HashEmbedder 数据的显式离线模式、可重试重建、原子激活和回滚；新旧模型向量绝不混查"
