        - "接入现有知识测试目标，覆盖本次实际新增行为；更新采用的依赖归属与相关 ADR 实施记录"
      out:
        - "关键词/RRF 排序、Wiki 引擎、通用任务编排、任意文档格式解析"
        - "面向员工新增模型密钥或第二个 LLM HTTP Gateway"
    constraints:
      - "只有接受的契约允许实现 DDL 与运行装配；model/version/config digest/dimension/preprocess 共同确定 generation。"
      - "模型 egress 复用中央 Policy 和 DLP；exempt 用户查看权限不能豁免外发脱敏；local-only 无可用本地路由时阻断。"
      - "新版本构建失败保留旧活动版本；首次失败无内容；构建期间不持有等待远程模型的数据库长事务。"
      - "后台任务保留 Workspace/actor/source/trace，但不持久化短期 JWT 或员工 key；执行时获取受限身份并检查授权是否仍有效。"
      - "远程取消、429、维数错误、非有限向量和依赖故障必须有明确失败；不静默回退 HashEmbedder。"
      - "拥有 packages/knowledge、必要 gateway 接线、migration 和部署变更；共享 Makefile 修改串行完成。"
    forbidden:
