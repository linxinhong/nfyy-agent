        - "新增 BM25 扩展或 Elasticsearch、全局 ANN 后过滤、Reranker 模型、自动 Prompt 注入"
        - "Wiki/Memory 路由和新 UI"
    constraints:
      - "生产模式使用语义向量切片的模型配置与 generation；查询失败显式报错，不更换模型或静默返回空命中。"
