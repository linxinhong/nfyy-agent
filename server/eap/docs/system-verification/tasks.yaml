  - id: TASK-054
    title: "P1 security fix: DLP seed pattern coverage vs evasive forms"
    status: done
    goal: >
      Close the four coverage gaps the TASK-047 adversarial corpus proved:
      password_field misses JSON-quoted keys ("password": "x" passes raw),
      internal_phone misses the 3-4-4 separated form (138 0013 8000),
      openai_key's prefix is case-sensitive (SK-... matches nothing), and
      db_conn_string's password segment escapes when it contains spaces.
      The TASK-047 self-verifying finding subtests flip from skip to pass,
      and the corpus absorbs the shapes as positive coverage.
    scope:
      in:
        - "migration updating the seeded patterns by rule name (ADR-0026 style: unconditional by-name updates, every pattern keeps a FINITE max match)"
        - "password_field: tolerate optional quoting around the key ("password" / 'password') with bounded value class"
        - "internal_phone: bounded 3-4-4 separator tolerance (separators only between digit groups — no free-running digit-space classes)"
        - "openai_key: case-insensitive prefix while keeping the bounded body"
        - "db_conn_string space-escape: fix with a bounded shape OR record as an accepted limitation with documented false-positive rationale (implementer's analysis decides; escalation if neither is defensible)"
        - "corpus update: TASK-047's TestDLPRuleFindings subtests converted from skip-while-unfixed to positive coverage; max-match re-derivation verified for every changed pattern"
      out:
        - "new DLP rules or rule-authoring features"
        - "validator/checksum changes (cn_* rules untouched)"
        - "engine changes (match semantics stay regexp)"
    constraints:
      - "ADR-0026 holds: every changed pattern derives a finite max match; the SSE holdback re-derives and perf-gateway stays green."
      - "False-positive review is part of the change: each widened pattern states what benign text it newly matches and why that is acceptable."
    forbidden:
      - "Unbounded repetition to 'fix' a gap (ADR-0026)."
      - "Weakening or skipping TASK-047 corpus assertions to make the fix look clean."
    acceptance:
      - type: command
        run: "make verify-security-adversarial && make verify-policy-dlp-audit && make perf-gateway"
      - type: assertion
        expect: "The four documented evasive shapes are now redacted/blocked per their rule class with zero new leaks in the corpus; TestDLPRuleFindings subtests pass as positive coverage; max-match derivation stays bounded and the perf gate holdback/throughput show no regression."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "apps/gateway/security_adversarial_integration_test.go TestDLPRuleFindings holds the failing shapes verbatim"
      - "migrations/000020 for the by-name update convention; docs/adr/0026 for the boundedness policy"
      - "packages/dlp/maxmatch.go derivation must accept every changed pattern"
    escalation_conditions:
      - "A gap cannot be closed within the bounded-pattern policy without unacceptable false positives (return the analysis; the shape becomes a documented accepted limitation)."
    result:
      owner: "zcode-35767"
      attempts: 0
      claimed_at: "2026-09-03T18:17:19.755Z"
      completed_at: "2026-09-03T18:42:04.229Z"
      worktree: ".tasks/worktrees/TASK-054"
