  - id: TASK-047
    title: "Security adversarial suite (authz matrix, leakage scan, DLP bypass corpus)"
    status: done
    goal: >
      Adversarial confidence on the three security surfaces: (1) an
      authorization matrix sweep over every governed endpoint x credential
      class (agk key, key-bound key, session JWT, revoked/expired key,
      cross-workspace) where every cell is asserted, not spot-checked;
      (2) an automated leakage scan proving no credential material
      appears in logs, error bodies, or generated client config; (3) a DLP
      bypass corpus (obfuscation, separators, chunk-boundary splits,
      checksum-evading permutations) where every bypass attempt is
      redacted, tokenized or blocked.
    scope:
      in:
        - "authz matrix sweep generated from an endpoint inventory (LLM, MCP, knowledge, skills, agents, admin, enterprise) x credential classes"
        - "credential-leakage scan: grep-class assertions over captured logs, response bodies, and eap sync/install output while exercising key lifecycle"
        - "DLP bypass corpus as a table-driven suite with expected outcomes per payload"
        - "rate-limit effectiveness at the configured limit (429 shape + recovery)"
        - "a make target running the whole suite"
      out:
        - "penetration testing of infrastructure (Docker host, PG auth, TLS termination)"
        - "protocol conformance (TASK-042)"
        - "fixing defects discovered here (extract fix cards)"
    constraints:
      - "The matrix is generated from a live route inventory, not a hand-written endpoint list, so new surfaces are swept automatically."
      - "Leakage scanning runs against the gateway's real log stream, not curated samples."
    forbidden:
      - "Adding real credential material to the repository, logs, or evidence."
      - "Exempting any endpoint from the matrix without an explicit architect note."
    acceptance:
      - type: command
        run: "make verify-security-adversarial"
      - type: assertion
        expect: "Every matrix cell asserts the expected outcome (zero 'skip by default' cells); the bypass corpus shows zero leaks across redact/tokenize/deny classes; the leakage scan is clean while a key lifecycle (create/use/revoke) runs."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "route inventory: apps/gateway/server.go Handler() registration order"
      - "credential classes: authenticateAPIKey vs key-bound selection vs session JWT (apps/gateway/auth.go)"
      - "existing boundary tests to extend, not duplicate: m2m5_gate, subject_dlp, sse_dlp suites"
    escalation_conditions:
