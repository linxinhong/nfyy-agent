  - id: TASK-055
    title: "P1 correctness fix: mid-stream provider death must never masquerade as clean completion"
    status: done
    goal: >
      In the three streaming handlers (chat, responses, messages), when the
      router's stream goroutine delivers an error and closes both channels,
      the handler's select can randomly pick the closed-chunks branch and
      treat the death as clean completion: no terminal error frame, outcome
      audited as allowed, a zero-usage ledger row written. After the fix,
      a mid-stream provider death ALWAYS produces the terminal SSE error
      frame, an audited failure outcome, and no fabricated usage —
      deterministically, across repeated runs.
    scope:
      in:
        - "gateway-side fix: before treating a closed chunks channel as completion, drain/inspect errCh (non-blocking) and prefer the error path"
        - "a deterministic regression test: a stub that errors and closes channels back-to-back, iterated N times, asserting the terminal error frame and audited failure outcome on every iteration"
        - "apply the same fix to all three streaming handlers"
      out:
        - "router channel-contract redesign (escalate if the gateway-side fix is insufficient)"
        - "partial-usage accounting for interrupted streams (ADR-0027 documents no usage row on routed errors)"
        - "client-cancellation behavior changes"
    constraints:
      - "Client cancellation semantics are untouched; the clean-completion path without an error is unchanged."
      - "Audit and usage semantics for the error outcome follow the existing contracts (failure audited, no fabricated usage)."
    forbidden:
