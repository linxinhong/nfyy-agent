tasks:
  - id: TASK-046
    title: "Failure-mode & degradation system suite"
    status: done
    goal: >
      Every external dependency failing mid-flight produces the contracted
      behavior, verified at the system level against the real stack: PG
      unavailable (fail closed with distinct store errors), Redis
      unavailable (rate limiting fails OPEN, audit still reliable),
      provider failover chains exhausted (deterministic, EAP-wrapped
      errors, no credential leakage), mid-stream provider death (client
      sees a terminal SSE error, usage/audit still recorded), and audit
      delivery failure (answer withheld). No goroutine or connection leak
      after each scenario drains.
    scope:
      in:
        - "degradation matrix tests driving the real handler chain with each dependency fault-injected (container stop / proxy reset / conn kill)"
        - "streaming mid-stream failure scenarios (client cancellation + upstream death)"
        - "leak checks after every scenario (goroutines, PG pool, idle conns)"
        - "a make target reproducibly running the whole matrix"
      out:
        - "multi-region/HA/cluster fault scenarios"
        - "application-level chaos beyond the five dependency classes above"
        - "fixing defects discovered here (extract fix cards; the suite stays honest)"
    constraints:
      - "Faults are injected at the infrastructure boundary (real PG/Redis/provider stubs), never by mocking the gateway's own layers."
      - "Every scenario asserts the documented contract: audit and DLP fail closed; rate limiting fails open; denials are distinguishable from outages."
    forbidden:
      - "Weakening a fail-closed contract to make a scenario pass."
      - "Sleeping through races instead of asserting drain and stability."
    acceptance:
      - type: command
        run: "make verify-failure-modes"
      - type: assertion
        expect: "Each dependency-failure scenario shows the contracted behavior with zero goroutine/pool growth after drain; a run report table lands in docs/verify/failure-modes.md."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "failover semantics: packages/llmkernel/router.go deterministic cursor; EAP-wrapped denial classes do not fail over"
      - "rate limiter fails open by contract (apps/gateway/ratelimit.go); audit fails closed (audit.RequireWriteBatch)"
      - "stream teardown: apps/gateway/protocols.go client-cancel and upstream-death paths"
    escalation_conditions:
      - "A contracted behavior cannot hold under a failure scenario without a design change (e.g. audit must survive PG loss) — return to architect."
    result:
      owner: "zcode-62085"
      attempts: 0
      claimed_at: "2026-09-03T16:41:33.980Z"
      completed_at: "2026-09-03T17:20:16.116Z"
