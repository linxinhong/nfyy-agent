  - id: TASK-036
    title: "Tool-calling passthrough on /v1/chat/completions"
    status: done
    goal: >
      OpenAI function calling works end to end through the routed provider
      path: tools/tool_choice pass through byte-faithfully, assistant
      tool_calls and tool results round-trip, streaming tool_calls deltas
      reach the client, finish_reason is the provider's (ADR-0025).
    scope:
      in:
        - "protocol-openai: tools/tool_choice on the request; tool_calls/tool_call_id/name on messages; tool_calls on deltas; additive JSON only"
        - "llmkernel routed client: payload passthrough, tool_calls in replies and stream deltas; ChatMessage gains tool fields"
        - "DLP scans tool_calls arguments (provider-bound) with redaction writeback; tool definitions are not scanned; streaming tool_calls deltas bypass the content sanitizer"
        - "Bifrost kernel path rejects tools with invalid_argument (fail loud, follow-up to support)"
        - "integration tests: non-stream tool_call round-trip, streaming tool_calls delta assembly, DLP argument scan, contract tests"
      out:
        - "Bifrost kernel tool mapping; Responses/Anthropic surfaces tool parity"
        - "server-side tool execution (tools stay client-side, /mcp governance unchanged)"
    constraints:
      - "Clients not using tools see zero behavior change; the contract grows additively."
      - "A deny-class DLP hit in tool arguments blocks the request fail-closed, like message content."
    forbidden:
      - "Silently dropping tools on any path (unsupported paths must reject loudly)."
      - "Text-transforming streaming tool_calls JSON fragments."
    acceptance:
      - type: command
        run: "make verify-tool-passthrough"
      - type: assertion
        expect: "A client sending tools receives the provider's tool_calls back (non-stream and stream assembled), with finish_reason tool_calls; tool arguments containing DLP hits are redacted or blocked fail-closed; a tools request on the Bifrost kernel path is rejected invalid_argument."
    dependencies:
      - TASK-035
    risk_level: L3
    investigation_hints:
      - "packages/protocol-openai/openai.go; packages/llmkernel/openai_client.go stream_client.go router_types.go scanMessages"
      - "apps/gateway/llm.go handleChatCompletions; apps/gateway/protocols.go handleChatStream"
    escalation_conditions:
      - "DLP redaction inside tool arguments JSON cannot be applied without corrupting the fragment."
