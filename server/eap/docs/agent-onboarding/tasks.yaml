tasks:
  - id: TASK-035
    title: "Workspace-bound API keys: one credential onboards an agent client"
    status: done
    goal: >
      An agk_* key can carry an optional server-side Workspace binding so
      clients that cannot send X-Agent-Workspace (Hermes-class SDK wrappers,
      CI jobs) are authorized with base_url + key alone. Selection precedence
      is frozen: explicit header → key binding → fail closed (ADR-0024).
    scope:
      in:
        - "additive nullable api_keys.workspace_id column with migration"
        - "POST /enterprise/v1/keys optional workspace field; creator membership verified server-side at creation, rejection fails closed; key views expose the binding"
        - "gateway workspace selection falls back to the key binding when the header is absent; membership is still resolved on every request; key-bound selection recorded in audit as origin=key_binding"
        - "regression tests: header-less bound key succeeds inside the bound workspace; header-less unbound key stays 403 workspace_forbidden; header override remains membership-gated; removing the user from the workspace invalidates a bound key; non-member binding attempt at creation is rejected"
        - "verify target wrapping the new integration tests plus the foundation gate; docs/dev/LOCAL-DEV.md documents the optional binding"
      out:
        - "Portal key-creation UI field"
        - "pinned/strict key mode (header must equal binding)"
        - "user-level default workspace"
        - "device credential and internal JWT semantics"
    constraints:
      - "The binding only nominates the candidate Workspace; WorkspaceContext.Source stays server_membership and the membership resolver runs on every request (revocation semantics preserved)."
      - "Existing unbound keys and header-carrying clients behave exactly as before; the schema change is additive and upgrade-safe."
    forbidden:
      - "Trusting the binding without the per-request membership check."
      - "Silently falling back to any workspace not established by header, binding, or membership (no user-level or gateway-config defaults)."
      - "Weakening or bypassing SelectWorkspace's fail-closed path to implement the fallback."
    acceptance:
      - type: command
        run: "make verify-key-bound-workspace"
      - type: assertion
        expect: "A finance-bound key calls /v1/chat/completions with no X-Agent-Workspace and succeeds; the same key with a secops header is still membership-gated; an unbound key without the header still receives 403 workspace_forbidden."
      - type: assertion
        expect: "Removing the key owner from the bound workspace denies the next header-less call with 403, proving the binding never outlives membership; creating a key bound to a workspace the creator does not belong to is rejected server-side."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "packages/identity/identity.go SelectWorkspace; apps/gateway/auth.go authenticated.Key; store.APIKey"
      - "migrations/000002_identity.sql api_keys; apps/gateway/enterprise.go handleCreateKey"
      - "apps/gateway/journey_integration_test.go cross-workspace denial fixtures"
    escalation_conditions:
      - "Implementing the fallback would require changing SelectWorkspace's fail-closed contract or adding a new WorkspaceSource."
      - "The key-creation membership check cannot reuse the existing resolver without duplicating authorization logic."
    result:
      owner: "zcode-52147-52219"
      attempts: 0
      claimed_at: "2026-09-03T06:22:29.984Z"
      completed_at: "2026-09-03T06:39:22.375Z"
      worktree: ".tasks/worktrees/TASK-035"
      branch: "task/task-035-key-bound-workspace"
      evidence:
        - {type: "command", check: "make verify-key-bound-workspace", status: "pass", summary: "PASS on merged main e8dc039: verify-foundation (fmt/vet/build/test/race) + TestAPIKeyWorkspaceBindingIntegration + TestAPIKeyBindingCreationGate against real PostgreSQL/Redis. Adjacent suites re-run on the branch with no regression: TestM0M3JourneyIntegration, TestMCPSliceIntegration, TestIdentitySliceIntegration, TestEAPV1ProductIntegration."}
        - {type: "assertion", check: "A finance-bound key calls /v1/chat/completions with no X-Agent-Workspace and succeeds; the same key with a secops header is still membership-gated; an unbound key without the header still receives 403 workspace_forbidden.", status: "pass", summary: "TestAPIKeyWorkspaceBindingIntegration: finance-bound key with no header returned 200 'binding ok' via stubbed provider; the same key with X-Agent-Workspace: secops was denied 403 workspace_forbidden (header wins, membership decides); the owner's unbound key without header stayed 403 workspace_forbidden. A dual-member (finance+secops) with a finance-bound key overrode via header to secops and got 200. Header-less token exchange with the bound key minted an internal JWT whose claims carry workspace_id=finance."}
