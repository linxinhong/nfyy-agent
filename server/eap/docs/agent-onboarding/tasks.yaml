  - id: TASK-042
    title: "Protocol conformance audit and gap closure (/v1 + /mcp)"
    status: done
    goal: >
      Stop fixing protocol gaps only when real clients trip over them: align
      the hand-rolled /v1 and /mcp surfaces against Bifrost schemas (in-repo
      baseline), the official OpenAI spec and MCP spec, and close the known
      gaps with mechanical conformance gates (docs/04 section 5).
    scope:
      in:
        - "[P0] /v1/* errors adopt the OpenAI error envelope ({\"error\":{\"message\",\"type\",\"code\",\"param\"}}) while /enterprise/* keeps the Problem shape; the enterprise Problem code rides error.code"
        - "forward the already-parsed temperature/top_p/max_tokens; parse and forward stop/parallel_tool_calls/stream_options.include_usage"
        - "assistant messages with tool_calls serialize content as null (strict clients), not empty string"
        - "[P1] MCP Streamable-HTTP transport per spec: Accept SSE negotiation, GET SSE stream, Mcp-Session-Id handling; validate with the official inspector"
        - "field-coverage matrix protocol-openai vs Bifrost schemas checked into docs/ and kept green by a contract test"
      out:
        - "provider feature expansion beyond passthrough (no server-side n>1 fan-out, no response_format translation)"
        - "knowledge/admin surfaces (already Problem-shaped, unchanged)"
    constraints:
      - "Bifrost schemas are the first baseline for field coverage; official specs settle disputes."
      - "Every /v1/* or /mcp/* contract change must pass the MCP inspector plus one real client journey (Hermes/Codex/litellm) before done."
    forbidden:
      - "Adding fields by guesswork without a reference client or spec."
      - "Breaking the /enterprise/* Problem contract while fixing /v1 envelopes."
    acceptance:
      - type: command
        run: "make verify-protocol-conformance"
      - type: assertion
        expect: "An OpenAI-strict client (litellm or openai-python strict mode) completes chat, tool-calling and error journeys against the gateway; the inspector passes tools/list and tools/call on /mcp/agent and /mcp/{server}; a contract test pins field coverage against the Bifrost schema baseline."
    dependencies:
