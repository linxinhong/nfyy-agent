        - {type: "command", check: "make verify-policy-dlp-audit", status: "pass", summary: "PASS on merged main: production OIDC + policy/DLP/audit integration suites with the cached loaders and single-flight DLP scanner in place."}
        - {type: "command", check: "make perf-gateway", status: "pass", summary: "PASS on merged main with production cache wiring: full-chain p95 17.34->10.45ms, DLP-off path p95 10.40->4.50ms (-57%, the eliminated control-data round trips), DLP-added delta 6.94->5.95ms (tokenize N+1 owned by TASK-037), SSE window ~131k chunks/sec unchanged. PRD §9 100ms budget holds with ~10x headroom."}
        - {type: "command", check: "go test -race ./packages/controlcache ./packages/dlp ./packages/policy ./packages/store", status: "pass", summary: "Race-clean: single-flight join under concurrent load, scanner expiry stampede regression, failure-retry semantics."}
        - {type: "assertion", check: "201 sequential routed requests after warm-up issue exactly one policy-rules load, one route-plan load, one provider-target load and one pricing load (TTL-bounded).", status: "pass", summary: "TestControlCachesSteadyStateLoadCounts: counting loaders over the real store behind the real handler chain; all four counters == 1 after 201 requests inside one TTL window."}
