  - id: TASK-038
    title: "Per-request durable-path compaction (auth chain + reliable audit batch)"
    status: done
    goal: >
      The remaining per-request durable round trips shrink without moving
      any security contract: key lookup, user load and membership resolve
      cost one round trip instead of three, last-used touch leaves the
      critical path, and the 2-3 reliable audit events of one routed chat
      are delivered by one batched write that still fails closed.
    scope:
      in:
        - "auth chain compaction (key + user + membership in one round trip) with revocation/expiry still resolved live per request"
        - "TouchAPIKey off the request critical path (best-effort semantics preserved, delivery failures still logged)"
        - "batched delivery for the per-request reliable audit event set (policy.decision / dlp.hit / llm.request)"
        - "tests proving a batched audit write failure still withholds the answer"
      out:
        - "audit event schema changes or new event types"
        - "credential broker changes"
        - "caching key validity or membership (explicitly out everywhere in this package)"
    constraints:
      - "Reliable-path semantics are untouched: any audit delivery failure still denies the request (llm.go fail-closed contract)."
      - "Revocation, expiry and membership are enforced from live state on every request."
    forbidden:
      - "Converting security audit into fire-and-forget/best-effort batching."
      - "Dropping or merging away individual audit events (batch the delivery, not the record set)."
    acceptance:
      - type: command
        run: "make verify-policy-dlp-audit && make verify-foundation && make perf-gateway"
      - type: assertion
        expect: "One routed non-streaming chat with a dlp.hit delivers its 3 audit events in a single store round trip (counting writer), a forced batch failure returns 'request could not be audited' with the answer withheld, and a revoked key is still rejected on the request that follows revocation."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "apps/gateway/auth.go authenticateAPIKey: key lookup, rate limit, user load, synchronous TouchAPIKey (auth.go:58-107)"
      - "apps/gateway/llm.go writeLLMGovernanceAudit writes 2-3 events sequentially (:154); recordUsage adds pricing + insert (:216)"
      - "TASK-033 constraint already allows batched inserts if that is production behavior"
    escalation_conditions:
      - "Audit batching cannot preserve fail-closed delivery, or auth compaction would require caching revocation state."
