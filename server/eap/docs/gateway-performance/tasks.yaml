  - id: TASK-037
    title: "DLP vault access batching (tokenize + reveal)"
    status: done
    goal: >
      DLP tokenize stops issuing per-match vault round trips and exempt-role
      re-substitution stops issuing per-pseudonym reveal queries: one
      multi-match scan costs a bounded number of vault statements and one
      released response costs one batched reveal. The perf gate's
      DLP-added p95 delta drops from ~7ms to <= 2ms with behavior unchanged.
    scope:
      in:
        - "batched/amortized tokenize path for multi-match scans (stable pseudonym per value preserved)"
        - "batched reveal for released content (response, SSE release hook, and any surface reusing the same store call)"
        - "optional bounded process-local memo of value->token, under the constraints below"
        - "regression coverage: multi-match scans, unknown tokens, cross-workspace reveal still fail closed"
      out:
        - "dlp_tokens schema changes or reveal API contract changes"
        - "new reveal surfaces (knowledge/MCP keep their current semantics)"
        - "rule-engine regex cost optimization"
    constraints:
      - "Pseudonym stability and workspace-scoped fail-closed reveal are unchanged; vault errors still fail the scan closed."
      - "Any value->token memo is bounded, process-local, server-side only, and never persisted or logged; dropping it must not change behavior."
    forbidden:
      - "Persisting the memo to disk or emitting cached originals into logs."
      - "Revealing across workspaces to save a query."
    acceptance:
      - type: command
        run: "make verify-policy-dlp-audit && make perf-gateway"
      - type: command
        run: "go test -race ./packages/dlp ./packages/store"
      - type: assertion
        expect: "A scan with ~20 tokenize hits issues a small bounded number of vault statements (probed via a counting store), a released response with ~20 pseudonyms issues one batched reveal, and dlp_added_overhead p95 on the perf gate is <= 2ms."
    dependencies: []
    risk_level: L2
    investigation_hints:
      - "packages/dlp/table.go tokenize branch calls the Tokenizer once per match (dlp/table.go:264)"
      - "packages/store/dlpvault.go TokenizeDLP is SELECT-then-INSERT per value; RevealDLP is single-row (dlpvault.go:21/69)"
      - "apps/gateway/dlpvault.go resubstituteTokens reveals one token per regex match (:102)"
    escalation_conditions:
      - "Batching cannot preserve stable pseudonyms or workspace-scoped fail-closed reveal without a vault schema change."
    result:
