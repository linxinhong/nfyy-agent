        - {type: "command", check: "make verify-policy-dlp-audit", status: "pass", summary: "PASS on merged main: policy/DLP/audit integration suites with derived holdback and bounded seed patterns."}
        - {type: "command", check: "make perf-gateway", status: "pass", summary: "PASS on merged main: full-chain p95 ~7-8ms against the 100ms budget. SSE window throughput 116k -> 54k chunks/sec — the honest cost of the now-exact ~1055-byte holdback (dominated by bounded db_conn_string), still 3+ orders of magnitude above real token-stream rates."}
        - {type: "assertion", check: "A dictionary term longer than the old 80-byte window split across two SSE chunks is caught exactly as an in-chunk occurrence.", status: "pass", summary: "Unit TestSSESanitizerHoldbackDerivedFromRules: derived holdback keeps a completable 240-byte multi-byte term in the window (the old 64+16 would have released its head) and the assembled output carries [REDACTED:codename]. Integration TestSSEHoldbackDerivedForLongDictionaryTerm: a 360-byte term split across two upstream chunks through the real streaming handler — zero term bytes reach the client, surrounding content still streams."}
        - {type: "assertion", check: "Holdback is derived from the live rule set, bounded by construction.", status: "pass", summary: "dlp.MaxMatchBytes derives from the pattern AST (regexp/syntax); unbounded repetition reports bounded=false and the gateway applies the documented 4096 cap. TestRuleMaxMatch covers fixed/repeat/alternation/unbounded shapes; migration 000020 bounds all six open-ended seed patterns so the default rule set derives exactly (ADR-0026)."}
