tasks:
  - id: TASK-036
    title: "Control-data caches on the LLM hot path"
    status: done
    goal: >
      A steady-state routed LLM request issues zero control-data reads:
      policy rules, route plans, provider targets and pricing are served
      from bounded process-local derived caches, and the DLP rule cache no
      longer serializes concurrent scans while reloading. Single-request
      full-chain p95 must not regress; cache staleness is bounded and
      control-plane writes propagate within the bound.
    scope:
      in:
        - "bounded derived cache for policy rules (today re-read from PostgreSQL on every Decide)"
        - "bounded derived caches for route plans, provider targets and pricing lookups"
        - "fix the DLP rule-cache reload so concurrent scans do not queue behind one lock-held load"
        - "tests proving load counts collapse to the TTL-bounded minimum and changes propagate within the documented bound"
      out:
        - "caching API-key validity, revocation/expiry, or workspace membership (never cached)"
        - "admin invalidation UI or a distributed invalidation subsystem"
        - "audit/usage write-path changes (TASK-038)"
    constraints:
      - "Caches are derived state with a staleness bound <= 60s (the DLP 60s rule cache is the in-repo precedent); load errors fail closed exactly as today."
      - "Subject/role filtering of DLP rules stays per-call and never enters the cache (no repeat of the privilege-leak cache poisoning)."
      - "Record the staleness-bound decision in a short ADR; state the propagation bound operators can expect after an admin write."
    forbidden:
      - "Serving authorization-relevant decisions from a cache that outlives the documented bound."
      - "Per-subject or per-workspace variants of the control-data caches."
    acceptance:
      - type: command
        run: "make verify-policy-dlp-audit && make perf-gateway"
      - type: command
        run: "go test -race ./packages/policy ./packages/dlp ./packages/store"
      - type: assertion
        expect: "With counting loaders injected, 200 sequential routed requests after warm-up issue one policy-rules load, one route-plan load per alias and one provider-target load per provider (TTL-bounded), and a rule change made mid-window takes effect within the documented bound."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "packages/policy/table.go Decide calls LoadRules with no cache (policy/table.go:32)"
      - "packages/store/provider_governance.go RoutePlanFor/ResolveProviderTarget/PricingKnown run per request"
      - "packages/dlp/table.go rules() holds the mutex across LoadRules — stampede at TTL expiry (dlp/table.go:177)"
      - "dlp.NewTableScanner cache discipline is the in-repo pattern to extend"
    escalation_conditions:
      - "The propagation bound cannot be honored without building a new invalidation subsystem, or caching would change authorization semantics rather than read mechanics."
    result:
      owner: "zcode-87489"
      attempts: 0
      claimed_at: "2026-09-03T07:38:37.695Z"
      completed_at: "2026-09-03T07:59:42.968Z"
