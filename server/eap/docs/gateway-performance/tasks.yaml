        - {type: "assertion", check: "A scan with ~20 tokenize hits issues a small bounded number of vault statements; a released response with multiple pseudonyms issues one batched reveal.", status: "pass", summary: "TestDLPVaultBatchedAccess: counting seams over the real handler — one TokenizeBatch call per scan carrying 4 unique values (12 occurrences), stable pseudonyms identical across repeated requests upstream; exactly one BatchReveal call per privileged release revealing both vaulted originals; unknown token 'unknown1token' stays pseudonym (fail closed); non-exempt user's release issues zero reveals and keeps pseudonyms."}
        - {type: "assertion", check: "dlp_added_overhead p95 on the perf gate is <= 2ms.", status: "pass", summary: "perf gate reports dlp_added_overhead p95 delta 0.45ms (was 5.95ms before batching, 6.94ms at the 2026-09 review baseline)."}
