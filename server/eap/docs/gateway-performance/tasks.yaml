  - id: TASK-039
    title: "SSE holdback derived from the rule set (cross-boundary leak fix)"
    status: done
    goal: >
      The streaming sanitizer's holdback window is derived from the compiled
      rule set (longest possible match + margin) instead of a hardcoded 64
      bytes, so no rule match — including long custom dictionary terms — can
      straddle an SSE release boundary and escape scanning. A regression
      test with a boundary-spanning long term fails on today's code and
      passes after the fix.
    scope:
      in:
        - "max-match derivation exposed from the compiled DLP rule set and consumed by the SSE sanitizer"
        - "bounded window guaranteed (derivation capped by construction, not by hope)"
        - "boundary-spanning regression tests: redact, tokenize and deny actions with long terms"
      out:
        - "SSE frame format or chunk-shape changes"
        - "rule authoring validation/UI"
        - "token-format-aware incremental matching (existing follow-up candidate, unchanged)"
    constraints:
      - "Streaming liveness is preserved: the window stays bounded; content is never buffered whole."
      - "The pseudonym-boundary guard ('[' holdback) keeps working with the derived holdback."
    forbidden:
      - "Reverting to a fixed magic number for the holdback."
      - "Releasing bytes that could still complete a rule match."
    acceptance:
      - type: command
        run: "make verify-llm-protocols && go test -race ./packages/dlp"
      - type: assertion
        expect: "A dictionary term longer than today's 80-byte window split across two SSE chunks is caught (redacted/tokenized/blocked) exactly as an in-chunk occurrence; the existing SSE DLP, re-substitution and perf-gateway suites stay green."
    dependencies: []
    risk_level: L3
    investigation_hints:
      - "apps/gateway/protocols.go passes a hardcoded maxMatch=64 to newSSESanitizer (:151-156)"
      - "apps/gateway/ssedlp.go holdback = maxMatch + 16 margin; release keeps an extra guard for '[' pseudonyms"
      - "packages/dlp/table.go compiled rules carry pattern/terms but no max-match metadata"
    escalation_conditions:
      - "Unbounded-length patterns (e.g. open-ended dictionary terms) make a derived holdback impossible without a rule-authoring policy change."
    result:
      owner: "zcode-60224"
      attempts: 0
      claimed_at: "2026-09-03T08:23:00.161Z"
      completed_at: "2026-09-03T08:53:22.237Z"
