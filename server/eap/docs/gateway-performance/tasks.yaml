        - "shared, explicitly-configured HTTP client/transport for provider execution (timeouts, idle-conn limits)"
        - "explicit pgxpool sizing with the chosen numbers documented next to the code"
        - "TTL on rate-limit counter keys (approximating the window) with test coverage"
      out:
        - "horizontal scaling, HA, or production cluster sizing (TASK-033 out, unchanged)"
        - "rate-limit algorithm changes (fixed window stays)"
        - "provider client retries/circuit breaking"
    constraints:
