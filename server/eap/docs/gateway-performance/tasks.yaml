  - id: TASK-043
    title: "Request-path RTT compaction III (governance single-RTT, auth+membership join, vault memo)"
    status: done
    goal: >
      A steady-state routed chat issues at most 3 round trips before the
      provider call (auth+membership, vault on tokenize hits) and ONE
      round trip for the governance commit after it — down from 8-9 —
      with every fail-closed contract unchanged. The 2026-09 saturation
      attribution showed round-trip contention, not the fsync commit,
      dominates the remaining ceiling.
    scope:
