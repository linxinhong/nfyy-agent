name: eap-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eap
      POSTGRES_PASSWORD: eap
      POSTGRES_DB: eap
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - eap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eap -d eap"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eap
      MINIO_ROOT_PASSWORD: eap-dev-secret
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - eap-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    environment:
      EAP_GATEWAY_ADDR: ":8080"
      EAP_DATABASE_URL: postgres://eap:eap@postgres:5432/eap?sslmode=disable
      EAP_REDIS_ADDR: redis:6379
      EAP_DEV_MODE: "1"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  eap-postgres-data: {}
  eap-minio-data: {}
